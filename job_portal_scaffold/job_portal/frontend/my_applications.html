<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My Applications | Global Careers</title>
  <link rel="stylesheet" href="{{ url_for('static_files', filename='css/style.css') }}"/>
</head>
<body>
<main class="container">
  <h1>My Applications</h1>
  <table class="table">
    <thead><tr><th>Job</th><th>Company</th><th>Status</th><th>Applied</th></tr></thead>
    <tbody>
      {% for a in applications %}
      <tr>
        <td><a href="/jobs/{{ a.job.id }}">{{ a.job.title }}</a></td>
        <td>{{ a.job.company or 'Confidential' }}</td>
        <td><span class="badge">{{ a.status }}</span></td>
        <td>{{ a.application_date.strftime('%Y-%m-%d %H:%M') }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4">No applications yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</main>
</body>
</html>
