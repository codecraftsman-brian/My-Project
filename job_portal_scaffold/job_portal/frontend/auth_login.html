<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login | Global Careers</title>
  <link rel="stylesheet" href="{{ url_for('static_files', filename='css/style.css') }}"/>
</head>
<body>
<main class="container narrow">
  <h1>Login</h1>
  <form method="post">
    {{ form.csrf_token }}
    <label>Email {{ form.email(size=40) }}</label>
    <label>Password {{ form.password(type="password", size=40) }}</label>
    <button type="submit">Login</button>
  </form>
  <p>New here? <a href="/auth/register">Create an account</a></p>
</main>
</body>
</html>
