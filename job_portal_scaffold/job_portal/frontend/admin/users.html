<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Users</title>
  <link rel="stylesheet" href="{{ url_for('static_files', filename='css/style.css') }}"/>
</head>
<body>
<main class="container">
  <h1>Registered Users</h1>
  <table class="table">
    <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Registered</th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.name }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.phone or '-' }}</td>
        <td>{{ u.created_date.strftime('%Y-%m-%d') }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</main>
</body>
</html>
