<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="static/css/output.css">
    <link rel="stylesheet" href="static/css/stylsheet.css">
</head>

<body>
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex gap-6 flex-col lg:flex-row">
            <!-- Main Television Section -->
            <div class="rounded-2xl shadow-2xl h-[23.5vh] bg-cover bg-center relative overflow-hidden cursor-pointer group transition-transform hover:scale-[1.02] duration-300"
                style="background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('static/images/Tv-display.jpg');">
                <div class="relative h-full flex items-center justify-center px-8">
                    <div class="text-white text-center lg:text-left max-w-2xl">
                        <h1 class="text-3xl sm:text-4xl lg:text-6xl font-bold mb-6 leading-tight">
                            Ultra HD <span class="text-yellow-300 drop-shadow-lg">Smart TVs</span>
                        </h1>
                        <p class="text-lg sm:text-xl lg:text-2xl mb-8 opacity-90">
                            Immerse yourself in stunning 4K visuals and smart entertainment
                        </p>
                        <button
                            class="bg-yellow-400 hover:bg-yellow-300 text-gray-900 px-8 py-4 rounded-full font-bold text-lg transition-all transform hover:scale-105 shadow-lg hover:shadow-xl">
                            Explore TVs
                        </button>
                    </div>
                </div>
            </div>
            <!-- Right Side Cards -->
            <div class="flex flex-col gap-6 w-full lg:w-80">
                <!-- Audio Card -->
                <div class="bg-cover bg-center rounded-xl shadow-lg hover:shadow-2xl transition-all transform hover:-translate-y-2 relative overflow-hidden cursor-pointer group h-[25vh] lg:h-[11vh]"
                    style="background-image: linear-gradient(135deg, rgba(59, 131, 246, 0.1), rgba(147, 51, 234, 0.1)), url('static/images/audio.jpg');">

                    <div class="absolute inset-0 bg-gradient-to-br from-blue-600/80 to-purple-700/80"></div>

                    <div class="relative h-full flex flex-col justify-between p-6">
                        <div class="flex items-start justify-between">
                            <div
                                class="bg-white/20 backdrop-blur-sm rounded-full p-3 group-hover:scale-110 transition-transform">
                                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15.536a5 5 0 001.414 1.414m4.95-4.95a2.5 2.5 0 00-3.536 0L6 13l4 4 1.293-1.293a2.5 2.5 0 000-3.536z">
                                    </path>
                                </svg>
                            </div>
                        </div>
                        <div class="text-white">
                            <h3 class="font-bold text-xl lg:text-2xl mb-2">Premium Audio</h3>
                            <p class="text-white/90 text-sm mb-3">Wireless headphones, speakers & sound systems</p>
                            <div class="flex items-center justify-between">
                                <span class="text-white font-bold text-lg">From $49</span>
                                <div class="flex items-center text-sm">
                                    <span class="mr-2">Shop Now</span>
                                    <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none"
                                        stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9 5l7 7-7 7"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Storage Card -->
                <div class="bg-cover bg-center rounded-xl shadow-lg hover:shadow-2xl transition-all transform hover:-translate-y-2 relative overflow-hidden cursor-pointer group h-[25vh] lg:h-[11vh]"
                    style="background-image: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(59, 130, 246, 0.1)), url('static/images/storage.jpg');">

                    <div class="absolute inset-0 bg-gradient-to-br from-green-500/80 to-blue-600/80"></div>

                    <div class="relative h-full flex flex-col justify-between p-6">
                        <div class="flex items-start justify-between">
                            <div
                                class="bg-white/20 backdrop-blur-sm rounded-full p-3 group-hover:scale-110 transition-transform">
                                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01">
                                    </path>
                                </svg>
                            </div>
                        </div>
                        <div class="text-white">
                            <h3 class="font-bold text-xl lg:text-2xl mb-2">Storage</h3>
                            <p class="text-white/90 text-sm mb-3">External drives, SSDs & backup solutions</p>
                            <div class="flex items-center justify-between">
                                <span class="text-white font-bold text-lg">From $29</span>
                                <div class="flex items-center text-sm">
                                    <span class="mr-2">Shop Now</span>
                                    <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none"
                                        stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9 5l7 7-7 7"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
