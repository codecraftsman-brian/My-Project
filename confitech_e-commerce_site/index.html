<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="static/output.css">
</head>

<body>
    <nav class="@container">
        <!-- Top navigation -->
        <div>
            <p class="text-center">Fast Delivery Nationwide. Call/WhatsApp: +(254)723 821 *** or +(254)723 821 *** to
                place your Order</p>
            <hr>
        </div>

        <!-- Main navigation -->
        <div class="flex flex-row justify-between items-center mx-12">
            <div class="w-40 mt-4">
                <img src="static/images/logo.png" alt="">
            </div>

            <div class="flex">
                <div>
                    <button
                        class="rounded-md border border-gray-300 shadow-sm px-2 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 ">
                        All Caterories
                    </button>
                </div>
                <div class="bg-gray-200 p-2 flex gap-2 items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-4">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                    <input class="h-6 w-70 placeholder:text-gray-500 placeholder:italic" type="text"
                        placeholder="Search for products, brands, and more...">
                    <button
                        class="rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 ">
                        Search
                    </button>
                </div>
            </div>

            <div class="flex gap-12">
                <div class="flex flex-row items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                    </svg>

                    <div class="flex flex-col">
                        <div>
                            <p>My Account</p>

                        </div>
                        <div>
                            <p class="font-bold">Login</p>
                        </div>
                    </div>
                </div>

                <div class="flex flex-row items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                    </svg>
                    <div class="flex flex-col">
                        <div>
                            <p>My cart</p>

                        </div>
                        <div>
                            <p class="font-bold">Ksh 0</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </nav>
</body>

</html>
