<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navbar with Brand Left, Nav Center, Book Now Right</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      padding-top: 100px;
    }

    .contact-section {
      background-color: #f8f9fa;
      position: fixed;
      top: 0;
      width: 100%;
      height: 30px;
      z-index: 1050;
      border-bottom: 1px solid #dee2e6;
      font-size: 14px;
    }

    .navbar {
      top: 30px;
      z-index: 1040;
      position: fixed;
      width: 100%;
      background: #f8f9fa;
    }

    /* Flex container for navbar: left-center-right */
    .navbar-container {
      display: flex;
      align-items: center;
      width: 100%;
      position: relative;
    }

    /* Left section: toggler + brand */
    .navbar-left {
      display: flex;
      align-items: center;
      flex: 1;
    }

    /* Center section: nav */
    .navbar-center {
      flex: 2;
      display: flex;
      justify-content: center;
    }

    /* Right section: book now */
    .navbar-right {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      position: relative;
    }

    /* Hide brand on mobile */
    @media (max-width: 767.98px) {
      .navbar-brand {
        display: none !important;
      }
      .book-now-desktop {
        display: none !important;
      }
      .book-now-mobile {
        display: block !important;
        position: fixed;
        top: 38px;
        right: 1rem;
        z-index: 1100;
      }
      /* Add right padding so nav doesn't go under mobile book now button */
      #navbarNav {
        padding-right: 120px;
      }
    }

    /* Show brand and desktop button only on md+ */
    @media (min-width: 768px) {
      .navbar-toggler {
        display: none !important;
      }
      .book-now-mobile {
        display: none !important;
      }
      .navbar-brand {
        display: block !important;
      }
      .book-now-desktop {
        display: inline-block !important;
      }
    }
  </style>
</head>
<body>

  <!-- Contact Info -->
  <div class="contact-section d-flex justify-content-center align-items-center">
    <span class="mx-3">contact1@example.com</span>
    <span class="mx-3">contact2@example.com</span>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-md navbar-light bg-light">
    <div class="container navbar-container">

      <!-- Left: toggler and brand -->
      <div class="navbar-left">
        <!-- Toggler (mobile) -->
        <button class="navbar-toggler me-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Brand (desktop) -->
        <a class="navbar-brand" href="#">Brand</a>
      </div>

      <!-- Center: nav items -->
      <div class="collapse navbar-collapse navbar-center" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Portfolio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>

      <!-- Right: Book Now buttons -->
      <div class="navbar-right">
        <!-- Desktop Book Now -->
        <a href="#" class="btn btn-primary book-now-desktop">Book Now</a>
      </div>

    </div>
  </nav>

  <!-- Mobile Book Now button fixed outside navbar -->
  <a href="#" class="btn btn-primary book-now-mobile d-md-none">Book Now</a>

  <!-- Main Content -->
  <div class="container mt-5 pt-5">
    <h1>Welcome to the Website</h1>
    <p>Brand on left, nav items center, book now on right on desktop. Mobile toggle left, book now fixed right.</p>
    <div style="height: 1500px;"></div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
