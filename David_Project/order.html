<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order – manuaAIrewrites</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <div class="brand"><div class="logo"></div><a href="index.html">manuaAIrewrites</a></div>
      <nav aria-label="Primary">
        <a class="link" href="index.html">Home</a>
        <a class="link" href="about.html">About</a>
        <a class="link" href="blog.html">Blog</a>
        <a class="link" href="support.html">Support</a>
        <a class="cta" href="order.html">Order Now</a>
      </nav>
    </div>
  </header>

  <section>
    <div class="container">
      <h2>Place an order</h2>
      <div class="card" aria-labelledby="orderTitle">
        <h3 id="orderTitle" style="margin:0 0 12px">Tell us about your project</h3>
        <div class="row" style="grid-template-columns: repeat(3, 1fr);">
          <div>
            <label for="name">Your name</label>
            <input type="text" id="name" placeholder="Jane Doe" />
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" />
          </div>
          <div>
            <label for="words2">Approx. words</label>
            <input type="number" id="words2" placeholder="1000" min="1" />
          </div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap: wrap; margin-top:14px">
          <button class="btn" type="button" id="startBtn">Start order</button>
          <button class="btn btn-ghost" type="button" id="contactBtn">Contact support</button>
        </div>
        <div style="margin-top:18px">
          <div class="price"><span>$</span><span id="totalCost">0</span><small>/ estimated</small></div>
          <small style="color:var(--muted)">Billed in 250-word blocks. <span id="blocks">0</span> block(s).</small>
        </div>
        <div style="display:flex; gap:10px; margin-top:12px">
          <button class="btn" id="calcBtn" type="button">Recalculate</button>
          <button class="btn btn-ghost" type="button" id="payBtn">Proceed to Payment</button>
        </div>
        <div id="paypal-container" style="margin-top:12px; display:none"></div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container foot">
      <div class="brand" style="color: var(--muted)"><div class="logo"></div><span>© <span id="year"></span> manuaAIrewrites</span></div>
      <div class="social"><a href="#" aria-label="Twitter"></a><a href="#" aria-label="LinkedIn"></a></div>
    </div>
  </footer>

  <script src="app.js"></script>
  <!-- PayPal SDK -->
  <script src="https://www.paypal.com/sdk/js?client-id=YOUR_CLIENT_ID&currency=USD"></script>
</body>
</html>
