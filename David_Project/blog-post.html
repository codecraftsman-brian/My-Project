<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog Post – manuaAIrewrites</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <div class="brand"><div class="logo" aria-hidden="true"></div><a href="index.html">manuaAIrewrites</a></div>
      <nav aria-label="Primary">
        <a class="link" href="index.html">Home</a>
        <a class="link" href="about.html">About</a>
        <a class="link" href="blog.html">Blog</a>
        <a class="link" href="support.html">Support</a>
        <a class="cta" href="order.html">Order Now</a>
      </nav>
    </div>
  </header>

  <article id="blogPost">
    <section class="hero" style="padding:48px 0 48px">
      <div class="container wrap" style="grid-template-columns:1fr">
        <h1 id="bpTitle" class="title" style="margin-bottom:8px"></h1>
        <p id="bpMeta" class="muted"></p>
      </div>
    </section>

    <section>
      <div class="container">
        <img id="bpImage" class="post-hero" alt="" style="width:100%; border-radius:14px; border:1px solid rgba(148,163,184,.15); box-shadow: var(--shadow);" />
        <div id="bpBody" class="post-body"></div>
      </div>
    </section>
  </article>

  <footer>
    <div class="container foot">
      <div class="brand" style="color: var(--muted)"><div class="logo" aria-hidden="true"></div><span>© <span id="year"></span> manuaAIrewrites</span></div>
      <div class="social"><a href="blog.html" aria-label="Back to blog">← Back to Blog</a></div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
